<!DOCTYPE html>
<html>

<head>

    <title>Smart Drive - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="login-page">

    <div class="login-box">

        <h1>☁ Smart Drive</h1>

        <p class="login-subtitle">
            Login to your Smart Drive
        </p>

        {% if error %}

        <div class="error-box">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter CSE username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="login-note">
            CSE users: username must start with <b>cse</b>
        </p>

    </div>

</body>

</html>
